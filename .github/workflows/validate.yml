name: Validate High Labs Intelligence
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate instructions and scripts
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Smoke test examples
        run: |
          python scripts/profile_tabular.py examples/producao-sintetica.csv --key evento_id > /dev/null
          python scripts/budget_variance.py examples/custos-sinteticos.csv > /dev/null
